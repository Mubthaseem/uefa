<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Zeta Sports Player (Shaka)</title>
  
  <!-- Shaka Player UI -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    
    /* Shaka video container to occupy full viewport */
    .player-wrap {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      inset: 0;
      background: #000;
    }
    #player {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }
    
    /* Green active styling for Shaka Player UI */
    :root {
      --primary: #00e676;
    }
    .shaka-range-element {
      color: var(--primary) !important;
    }
    .shaka-volume-bar {
      color: var(--primary) !important;
    }
    .shaka-spinner-path {
      stroke: var(--primary) !important;
    }
    .shaka-play-button {
      background: var(--primary) !important;
    }

    /* ── Loading Overlay ── */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease;
      opacity: 1;
    }
    #loading-overlay.hidden {
      opacity: 0;
    }
    #loading-overlay .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 15px;
    }
    #loading-overlay .text {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ── Floating Watermark ── */
    #hx-watermark {
      position: absolute;
      left: 50%;
      bottom: 65px;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.42;
      pointer-events: none;
      transition: opacity .3s, bottom .3s;
      font-family: 'Rajdhani', sans-serif;
      text-align: center;
    }
    #hx-watermark .wm-rule {
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8001d);
    }
    #hx-watermark .wm-rule.right {
      background: linear-gradient(90deg, #e8001d, transparent);
    }
    #hx-watermark .wm-text { display: flex; flex-direction: column; align-items: center; }
    #hx-watermark .wm-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: #fff;
    }
    #hx-watermark .wm-name .r { color: #e8001d; }
    #hx-watermark .wm-url {
      font-size: 9px;
      letter-spacing: 3px;
      color: #c8d0da;
      margin-top: 2px;
    }

    /* Watermark behavior when controls fade */
    .shaka-controls-hide #hx-watermark {
      opacity: 0.28 !important;
      bottom: 25px;
    }
  </style>
</head>
<body>
  <div class="player-wrap" id="player-container">
    <video id="player" autoplay playsinline></video>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="text">PLEASE WAIT TO LOAD...</div>
    </div>
  </div>

  <script>
    (function () {
      // Domain Lock Whitelist
      const allowedDomains = [
        'mubthaseem.github.io',
        'zeta-stream.blogspot.com',
        'zetasports.blog',
        'localhost',
        'b4.taazaboom.com',
        'ehdbsduvsddhbhbsd.blogspot.com'
      ];
      
      const currentHost = window.location.hostname.toLowerCase();
      const isAuthorized = allowedDomains.some(domain => 
        currentHost === domain || currentHost.endsWith('.' + domain)
      );

      if (!isAuthorized) {
        document.body.innerHTML = '<div style="color:#ff3333; text-align:center; margin-top:20%; font-family:sans-serif;"><h2>Access Denied</h2><p>This player cannot be embedded on this domain.</p></div>';
        return;
      }

      const params = new URLSearchParams(location.search);
      let videoURL = params.get('x');
      
      if (!videoURL) {
        videoURL = 'https://customer-d2wx6hg0y7zyfsis.cloudflarestream.com/a919aca8e8fadded8ba82cbbb3c43b04/manifest/video.m3u8';
      } else if (videoURL.includes('mubthaseem-zeta-stream.hf.space') || videoURL.includes('stream.zetasports.blog') || videoURL.includes('stream3.zetasports.blog')) {
        const useReplica = Math.random() < 0.5;
        const targetSpace = useReplica ? 'mubthaseem-zeta-stream-3' : 'mubthaseem-zeta-stream';
        videoURL = `https://${targetSpace}.hf.space/live/live.m3u8`;
      }
      
      // Append cache buster to the main HLS manifest URL
      videoURL = videoURL + (videoURL.includes('?') ? '&' : '?') + 't=' + Date.now();

      // Extract clearKeys DRM from query params (e.g. ?key=kid:keyval or ?key=kid1:keyval1,kid2:keyval2)
      const clearKeys = {};
      const keyParam = params.get('key');
      if (keyParam) {
        const parts = keyParam.split(',');
        parts.forEach(part => {
          const pair = part.split(':');
          if (pair.length === 2) {
            clearKeys[pair[0].trim()] = pair[1].trim();
          }
        });
      }

      let consecutiveRetries = 0;
      let isPlayingFallback = false;
      let playerInstance = null;
      let uiInstance = null;

      const loadingOverlay = document.getElementById('loading-overlay');
      
      function showLoading() {
        loadingOverlay.classList.remove('hidden');
      }

      function hideLoading() {
        loadingOverlay.classList.add('hidden');
      }

      function getFallbackVideo() {
        const base = videoURL.includes('mubthaseem-zeta-stream-3.hf.space')
          ? 'https://mubthaseem-zeta-stream-3.hf.space/live/offline.mp4'
          : 'https://mubthaseem-zeta-stream.hf.space/live/offline.mp4';
        return base + '?t=' + Date.now();
      }

      async function loadFallbackVideo() {
        if (isPlayingFallback) return;
        isPlayingFallback = true;
        showLoading();
        const videoEl = document.getElementById('player');
        videoEl.loop = true;
        const fallback = getFallbackVideo();
        console.log("Loading fallback video:", fallback);
        try {
          await playerInstance.load(fallback);
        } catch (e) {
          console.error("Fallback load failed:", e.message);
        }
      }

      async function initPlayer() {
        if (typeof shaka !== 'undefined' && shaka.polyfill) {
          shaka.polyfill.installAll();
        }

        const videoEl = document.getElementById('player');
        const containerEl = document.getElementById('player-container');
        
        // Hide overlay on actual video playback starting
        videoEl.addEventListener('playing', hideLoading);
        videoEl.addEventListener('waiting', showLoading);
        
        playerInstance = new shaka.Player(videoEl);

        // DRM clearKeys setup
        if (Object.keys(clearKeys).length > 0) {
          playerInstance.configure({
            drm: {
              clearKeys: clearKeys
            }
          });
        }

        // Shaka UI Overlay Setup
        if (shaka.ui && shaka.ui.Overlay) {
          uiInstance = new shaka.ui.Overlay(playerInstance, containerEl, videoEl);
          const uiConfig = {
            controlPanelElements: [
              'play_pause',
              'mute',
              'volume',
              'spacer',
              'time_and_duration',
              'quality',
              'fullscreen',
              'overflow_menu'
            ]
          };
          uiInstance.configure(uiConfig);
        }

        // Error listener
        playerInstance.addEventListener('error', (event) => {
          const error = event.detail;
          console.warn("Shaka Player stream error:", error.code, error.message);
          
          if (isPlayingFallback) return;

          consecutiveRetries++;
          if (consecutiveRetries > 3) {
            console.log("Too many consecutive stream errors. Switching to fallback.");
            loadFallbackVideo();
            return;
          }

          console.log(`Verifying stream health (attempt ${consecutiveRetries})...`);
          showLoading();
          fetch(videoURL, { method: 'HEAD' })
            .then(res => {
              if (res.status === 404 || res.status === 403) {
                console.log("Stream file returned 404/403. Switching to fallback.");
                loadFallbackVideo();
              } else {
                console.log("Stream file is still present. Retrying playback in 3s...");
                setTimeout(async () => {
                  if (!isPlayingFallback) {
                    try {
                      await playerInstance.load(videoURL);
                      consecutiveRetries = 0;
                    } catch(_) {}
                  }
                }, 3000);
              }
            })
            .catch(() => {
              console.log("Stream file fetch failed. Switching to fallback.");
              loadFallbackVideo();
            });
        });

        // Load stream
        try {
          showLoading();
          await playerInstance.load(videoURL);
          console.log("Stream loaded successfully via Shaka Player");
        } catch (e) {
          console.error("Initial load failed. Triggering fallback check:", e.message);
          loadFallbackVideo();
        }

        // Append Watermark
        const wm = document.createElement('div');
        wm.id = 'hx-watermark';
        wm.innerHTML =
          '<span class="wm-rule"></span>' +
          '<span class="wm-text">' +
            '<span class="wm-name"> <span class="r"> </span></span>' +
            '<span class="wm-url"> </span>' +
          '</span>' +
          '<span class="wm-rule right"></span>';
        containerEl.appendChild(wm);
      }

      document.addEventListener('DOMContentLoaded', initPlayer);
    })();
  </script>
</body>
</html>
