<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Zeta Sports Player (JW)</title>
  
  <!-- JW Player & P2P Wrapper -->
  <script src="https://ssl.p.jwpcdn.com/player/v/8.21.2/jwplayer.js"></script>
  <script>jwplayer.key="64HPbvSQorQcd52B8XFuhMtEoitbvY/EXJmMBfKcXZQU2Rnn";</script>
  <script src="https://cdn.jsdelivr.net/npm/cdnbye@latest/dist/jwplayer-p2p-wrapper.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .player-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }
    #player {
      width: 100% !important;
      height: 100% !important;
    }
    
    /* Green active styling for JW Player */
    .jwplayer {
      --jw-color-active: #00e676 !important;
      --jw-color-inactive: #94a3b8 !important;
      --jw-controlbar-icons-active: #00e676 !important;
    }
    /* Hide JW Player logo and watermarks */
    .jw-logo, .jw-logo-container, .jw-logo-button, .jw-watermark {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* ── Floating Watermark ── */
    #hx-watermark {
      position: absolute;
      left: 50%;
      bottom: 65px;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.42;
      pointer-events: none;
      transition: opacity .3s, bottom .3s;
      font-family: 'Rajdhani', sans-serif;
      text-align: center;
    }
    #hx-watermark .wm-rule {
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8001d);
    }
    #hx-watermark .wm-rule.right {
      background: linear-gradient(90deg, #e8001d, transparent);
    }
    #hx-watermark .wm-text { display: flex; flex-direction: column; align-items: center; }
    #hx-watermark .wm-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: #fff;
    }
    #hx-watermark .wm-name .r { color: #e8001d; }
    #hx-watermark .wm-url {
      font-size: 9px;
      letter-spacing: 3px;
      color: #c8d0da;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <div id="player"></div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const videoURL = params.get('x') || 'https://mubthaseem-zeta-stream.hf.space/live/live.m3u8';
      
      const jwInstance = jwplayer('player').setup({
        playlist: [{
          file: videoURL,
          type: 'hls'
        }],
        logo: {
          file: ''
        },
        width: '100%',
        height: '100%',
        autostart: true,
        mute: false,
        advertising: {
          client: 'vast',
          skipoffset: 5,
          schedule: [{
            offset: 'pre',
            tag: 'https://ronracepub.com/e/base36/2plie0buxhrpu07q7zuklsfnh4ghsad8cl74b71h0oba9m5amqnquzpg8574c7beggyzvg05lm8p2m3c612u86ckl2'
          }]
        }
      });

      // Initialize P2P configuration on the JW Player instance
      if (typeof JWPlayerP2PWraper !== 'undefined') {
        JWPlayerP2PWraper.init(jwInstance, {
          p2pConfig: {
            logLevel: 'none'
          }
        });
      }

      // Add watermark to player container
      jwInstance.on('ready', () => {
        const jwContainer = document.querySelector('.jwplayer');
        
        const wm = document.createElement('div');
        wm.id = 'hx-watermark';
        wm.innerHTML =
          '<span class="wm-rule"></span>' +
          '<span class="wm-text">' +
            '<span class="wm-name">ZETA<span class="r">SPORTS</span></span>' +
            '<span class="wm-url">zetasports.onlinr</span>' +
          '</span>' +
          '<span class="wm-rule right"></span>';
        
        if (jwContainer) {
          jwContainer.appendChild(wm);
        }
      });

      // Autoplay play error catcher
      jwInstance.on('playAttemptFailed', () => {
        console.log("Autoplay failed, user interaction required.");
      });
    })();
  </script>
</body>
</html>
