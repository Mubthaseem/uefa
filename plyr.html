<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin">
  <title>Zeta Sports Player</title>
  
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.2/plyr.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .player-wrap {
      width: 100%;
      height: 100%;
      background: #000;
      position: relative;
    }
    .player-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .plyr--video .plyr__control--overlaid {
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
    }

    /* ── HELLOSPORTS watermark ── */
    #hx-watermark {
      position: absolute;
      left: 50%;
      bottom: 62px;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.42;
      pointer-events: none;
      transition: opacity .3s, bottom .3s;
      font-family: 'Rajdhani', sans-serif;
      text-align: center;
    }
    #hx-watermark .wm-rule {
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8001d);
    }
    #hx-watermark .wm-rule.right {
      background: linear-gradient(90deg, #e8001d, transparent);
    }
    #hx-watermark .wm-text { display: flex; flex-direction: column; align-items: center; }
    #hx-watermark .wm-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: #fff;
    }
    #hx-watermark .wm-name .r { color: #e8001d; }
    #hx-watermark .wm-url {
      font-size: 9px;
      letter-spacing: 3px;
      color: #c8d0da;
      margin-top: 2px;
    }
    .plyr:fullscreen #hx-watermark,
    .plyr:-webkit-full-screen #hx-watermark {
      bottom: 70px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>
  </div>

  <!-- CDNBye P2P-wrapped Hls.js and Plyr -->
  <script src="https://cdn.jsdelivr.net/npm/cdnbye@latest/dist/hls.min.js"></script>
  <script src="https://cdn.plyr.io/3.6.2/plyr.polyfilled.js"></script>
  
  <script>
    (function () {
      // Domain Lock Whitelist
      const allowedDomains = [
        'mubthaseem.github.io',
        'zeta-stream.blogspot.com',
        'zetasports.blog',
        'localhost',
        'b4.taazaboom.com',
        'ehdbsduvsddhbhbsd.blogspot.com'
      ];
      
      const currentHost = window.location.hostname.toLowerCase();
      const isAuthorized = allowedDomains.some(domain => 
        currentHost === domain || currentHost.endsWith('.' + domain)
      );

      if (!isAuthorized) {
        document.body.innerHTML = '<div style="color:#ff3333; text-align:center; margin-top:20%; font-family:sans-serif;"><h2>Access Denied</h2><p>This player cannot be embedded on this domain.</p></div>';
        return;
      }

      const video = document.getElementById('player');
      const params = new URLSearchParams(location.search);
      const videoURL = params.get('x') || 'https://mubthaseem-zeta-stream.hf.space/live/live.m3u8';
      if (!videoURL) return;

      function addWatermark(player) {
        const wm = document.createElement('div');
        wm.id = 'hx-watermark';
        wm.innerHTML =
          '<span class="wm-rule"></span>' +
          '<span class="wm-text">' +
            '<span class="wm-name">ZETA<span class="r">SPORTS</span></span>' +
            '<span class="wm-url">zetasports.onlinr</span>' +
          '</span>' +
          '<span class="wm-rule right"></span>';
        player.elements.container.appendChild(wm);
      }

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if (isIOS) {
        // Native HLS playback on iOS (Safari doesn't support MediaSource Extensions)
        video.src = videoURL;
        const player = new Plyr(video, {
          fullscreen: { enabled: true, fallback: true, iosNative: true }
        });
        addWatermark(player);
        return;
      }

      if (!Hls.isSupported()) return;

      // Initialize P2P HLS Engine
      const hls = new Hls({
        p2pConfig: {
          logLevel: 'none',
          token: '7vXiUvavR'
        }
      });
      
      hls.loadSource(videoURL);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        const qualities = [];
        hls.levels.forEach(function (level) {
          if (level.height && !qualities.includes(level.height)) {
            qualities.push(level.height);
          }
        });
        qualities.sort(function (a, b) { return b - a; });
        
        // Add 0 to represent "Auto" adaptive quality
        const qualityOptions = [0, ...qualities];

        const player = new Plyr(video, {
          settings: ['quality', 'speed', 'fullscreen'],
          fullscreen: { enabled: true, fallback: true, iosNative: true },
          i18n: {
            qualityLabel: {
              0: 'Auto'
            }
          },
          quality: {
            default: 0, // Default to Auto
            options: qualityOptions,
            forced: true,
            onChange: function (q) {
              if (q === 0) {
                hls.currentLevel = -1; // Auto adaptive switching
              } else {
                hls.levels.forEach(function (level, index) {
                  if (level.height === q) {
                    hls.currentLevel = index;
                  }
                });
              }
            }
          }
        });
        
        addWatermark(player);

        // Click to play/pause helper
        video.addEventListener('click', function () {
          if (player.playing) player.pause();
          else player.play();
        });
      });
    })();
  </script>
</body>
</html>
