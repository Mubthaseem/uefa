

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin">
  <title>Zeta Sports Player (JW)</title>
  
  <!-- JW Player -->
  <script src="https://ssl.p.jwpcdn.com/player/v/8.21.2/jwplayer.js"></script>
  <script>jwplayer.key="64HPbvSQorQcd52B8XFuhMtEoitbvY/EXJmMBfKcXZQU2Rnn";</script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .player-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }
    #player {
      width: 100% !important;
      height: 100% !important;
    }
    
    /* Green active styling for JW Player */
    .jwplayer {
      --jw-color-active: #00e676 !important;
      --jw-color-inactive: #94a3b8 !important;
      --jw-controlbar-icons-active: #00e676 !important;
    }
    .jw-logo, .jw-watermark {
      display: none !important;
    }

    /* ── Floating Watermark ── */
    #hx-watermark {
      position: absolute;
      left: 50%;
      bottom: 65px;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.42;
      pointer-events: none;
      transition: opacity .3s, bottom .3s;
      font-family: 'Rajdhani', sans-serif;
      text-align: center;
    }
    #hx-watermark .wm-rule {
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8001d);
    }
    #hx-watermark .wm-rule.right {
      background: linear-gradient(90deg, #e8001d, transparent);
    }
    #hx-watermark .wm-text { display: flex; flex-direction: column; align-items: center; }
    #hx-watermark .wm-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: #fff;
    }
    #hx-watermark .wm-name .r { color: #e8001d; }
    #hx-watermark .wm-url {
      font-size: 9px;
      letter-spacing: 3px;
      color: #c8d0da;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <div id="player"></div>
  </div>

  <script>
    (function () {
      // Domain Lock Whitelist
      const allowedDomains = [
        'mubthaseem.github.io',
        'zeta-stream.blogspot.com',
        'zetasports.blog',
        'localhost',
        'b4.taazaboom.com',
        'ehdbsduvsddhbhbsd.blogspot.com'
      ];
      
      const currentHost = window.location.hostname.toLowerCase();
      const isAuthorized = allowedDomains.some(domain => 
        currentHost === domain || currentHost.endsWith('.' + domain)
      );

      if (!isAuthorized) {
        document.body.innerHTML = '<div style="color:#ff3333; text-align:center; margin-top:20%; font-family:sans-serif;"><h2>Access Denied</h2><p>This player cannot be embedded on this domain.</p></div>';
        return;
      }

      const params = new URLSearchParams(location.search);
      let videoURL = params.get('x') || 'https://stream.zetasports.blog/live/live.m3u8';
      
      if (videoURL.includes('mubthaseem-zeta-stream.hf.space') || videoURL.includes('stream.zetasports.blog') || videoURL.includes('stream3.zetasports.blog')) {
        videoURL = 'https://stream.zetasports.blog/live/live.m3u8';
      }

      const jwInstance = jwplayer('player').setup({
        playlist: [{
          file: videoURL,
          type: 'hls'
        }],
        width: '100%',
        height: '100%',
        autostart: true,
        mute: false,
        advertising: {
          client: 'vast',
          skipoffset: 5,
          schedule: [{
            offset: 'pre',
            tag: 'https://ronracepub.com/e/base36/2plie0buxhrpu07q7zuklsfnh4ghsad8cl74b71h0oba9m5amqnquzpg8574c7beggyzvg05lm8p2m3c612u86ckl2'
          }]
        }
      });

      let consecutiveRetries = 0;

      jwInstance.on('playing', () => {
        consecutiveRetries = 0;
      });

      jwInstance.on('error', (event) => {
        console.warn("JW Player stream error:", event.message, event.code);
        const item = jwInstance.getPlaylistItem();
        const currentFile = item ? item.file : '';
        if (currentFile !== 'https://stream.zetasports.blog/offline.mp4') {
          consecutiveRetries++;
          if (consecutiveRetries > 3) {
            console.log("Too many consecutive stream errors. Switching to fallback.");
            loadFallbackVideo();
            return;
          }

          console.log(`Verifying stream health (attempt ${consecutiveRetries})...`);
          fetch(currentFile, { method: 'HEAD' })
            .then(res => {
              if (res.status === 404 || res.status === 403) {
                console.log("Stream file returned 404/403. Switching to fallback.");
                loadFallbackVideo();
              } else {
                console.log("Stream file is still present. Retrying playback in 3s...");
                setTimeout(() => {
                  const checkItem = jwInstance.getPlaylistItem();
                  const checkFile = checkItem ? checkItem.file : '';
                  if (checkFile !== 'https://stream.zetasports.blog/offline.mp4') {
                    jwInstance.load([{ file: currentFile, type: 'hls' }]);
                    jwInstance.play();
                  }
                }, 3000);
              }
            })
            .catch(() => {
              console.log("Stream file fetch failed. Switching to fallback.");
              loadFallbackVideo();
            });
        }
      });

      jwInstance.on('setupError', (event) => {
        console.error("JW Player setup error:", event.message);
        loadFallbackVideo();
      });

      jwInstance.on('complete', () => {
        const item = jwInstance.getPlaylistItem();
        const currentFile = item ? item.file : '';
        if (currentFile === 'https://stream.zetasports.blog/offline.mp4') {
          jwInstance.play();
        }
      });

      function loadFallbackVideo() {
        jwInstance.load([{
          file: 'https://stream.zetasports.blog/offline.mp4',
          type: 'mp4'
        }]);
        jwInstance.setConfig({ repeat: true });
        jwInstance.play();
      }

      // Add watermark to player container
      jwInstance.on('ready', () => {
        const jwContainer = document.querySelector('.jwplayer');
        
        const wm = document.createElement('div');
        wm.id = 'hx-watermark';
        wm.innerHTML =
          '<span class="wm-rule"></span>' +
          '<span class="wm-text">' +
            '<span class="wm-name"> <span class="r"> </span></span>' +
            '<span class="wm-url"> </span>' +
          '</span>' +
          '<span class="wm-rule right"></span>';
        
        if (jwContainer) {
          jwContainer.appendChild(wm);
        }
      });

      // Autoplay play error catcher
      jwInstance.on('playAttemptFailed', () => {
        console.log("Autoplay failed, user interaction required.");
      });
    })();
  </script>
</body>
</html>
