<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
  <title>ZETA SPORTS – Premium Live Player</title>
  
  <!-- Shaka Player UI & Controls -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.min.css">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00e676;
      --primary-glow: rgba(0, 230, 118, 0.4);
      --bg-dark: #05070a;
      --bg-sidebar: #0a0f1a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(0, 230, 118, 0.06);
      --bg-card-active: rgba(0, 230, 118, 0.12);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    /* ── App Layout (Split Screen) ── */
    .app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .player-section {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: #000;
    }

    .sidebar-section {
      width: 340px;
      height: 100%;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* ── Video Player Container ── */
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Override Shaka UI colors to match green theme */
    .shaka-range-element {
      color: var(--primary) !important;
    }
    .shaka-spinner-path {
      stroke: var(--primary) !important;
    }

    /* ── Floating Watermark ── */
    #wm {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.6;
      transition: opacity 0.4s ease, bottom 0.4s ease;
    }
    .shaka-controls-hide #wm {
      opacity: 0.35;
      bottom: 25px;
    }
    .wm-rule {
      width: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary));
    }
    .wm-rule.r {
      background: linear-gradient(90deg, var(--primary), transparent);
    }
    .wm-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .wm-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 2px 10px #000, 0 0 20px rgba(0, 230, 118, 0.3);
    }
    .wm-name span {
      color: var(--primary);
    }
    .wm-url {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 0 1px 5px #000;
    }

    /* ── Floating Join Button ── */
    #join-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      display: block;
      height: 34px;
      width: 110px;
      color: #ccc;
      border: 2px solid #ccc;
      padding: 1px 0;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      line-height: 28px;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    #join-btn:hover {
      color: #fff;
      border-color: #fff;
      background: rgba(0, 0, 0, 0.55);
    }
    .shaka-controls-hide #join-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Server Selection Sidebar UI ── */
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
    }
    .sidebar-title span {
      color: var(--primary);
    }
    .server-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .server-item {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }
    .server-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 230, 118, 0.25);
      transform: translateX(-2px);
    }
    .server-item.active {
      background: var(--bg-card-active);
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.1);
    }
    .server-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .server-name {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .server-item.active .server-name {
      color: var(--primary);
    }
    .server-meta {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .badge-vpn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Custom Scrollbar */
    .server-list::-webkit-scrollbar {
      width: 6px;
    }
    .server-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .server-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    .server-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ── Iframe Overlay ── */
    #iframe-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: none;
      background: #000;
    }
    #iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #iframe-container.active {
      display: block;
    }

    /* ── Type Badge ── */
    .badge-type {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-left: 6px;
    }

    /* ── Fullscreen / Embed Mode (sidebar hidden) ── */
    body.fullscreen-mode .sidebar-section {
      display: none;
    }
    body.fullscreen-mode .player-section {
      width: 100vw;
      height: 100vh;
    }

    /* ── Responsive Layout (Mobile/Tablet) ── */
    @media (max-width: 768px) {
      .app-layout {
        flex-direction: column;
      }
      .player-section {
        width: 100%;
        aspect-ratio: 16/9;
        flex: none;
        height: auto;
      }
      .sidebar-section {
        width: 100%;
        flex: 1;
        border-left: none;
        border-top: 1px solid var(--border);
      }
      #wm {
        bottom: 55px;
      }
      .shaka-controls-hide #wm {
        bottom: 15px;
      }
    }
  </style>
</head>

      </div>
    </div>
  </div>
