  <style>
    :root {
      --primary: #00e676;
      --primary-glow: rgba(0, 230, 118, 0.4);
      --bg-dark: #05070a;
      --bg-sidebar: #0a0f1a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(0, 230, 118, 0.06);
      --bg-card-active: rgba(0, 230, 118, 0.12);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    /* ── App Layout (Split Screen) ── */
    .app-layout {
      display: flex;
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .player-section {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: #000;
    }

    .sidebar-section {
      width: 300px;
      height: 100%;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── Video Player Container ── */
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Override Shaka UI styling to match green theme */
    .shaka-range-element {
      color: var(--primary) !important;
    }
    .shaka-volume-bar {
      color: var(--primary) !important;
    }
    .shaka-spinner-path {
      stroke: var(--primary) !important;
    }
    .shaka-play-button {
      background: var(--primary) !important;
    }

    /* JW Player styling overrides to match green theme */
    .jwplayer {
      --jw-color-active: var(--primary) !important;
      --jw-color-inactive: var(--text-muted) !important;
      --jw-controlbar-icons-active: var(--primary) !important;
    }
    .jw-logo, .jw-watermark {
      display: none !important;
    }

    /* ── Floating Watermark ── */
    #wm {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647 !important; /* Always on top of all players and control bars */
      pointer-events: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.6;
      transition: opacity 0.4s ease, bottom 0.4s ease;
    }
    .shaka-controls-hide #wm, .jw-flag-user-inactive #wm {
      opacity: 0.5 !important;
      bottom: 25px;
    }
    #player-container:fullscreen #wm,
    #player-container:-webkit-full-screen #wm,
    .jw-flag-fullscreen #wm {
      opacity: 0.5 !important;
    }
    .wm-rule {
      width: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary));
    }
    .wm-rule.r {
      background: linear-gradient(90deg, var(--primary), transparent);
    }
    .wm-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .wm-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 2px 10px #000, 0 0 20px rgba(0, 230, 118, 0.3);
    }
    .wm-name span {
      color: var(--primary);
    }
    .wm-url {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 0 1px 5px #000;
    }

    /* ── Floating Join Button ── */
    #join-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 2147483647 !important; /* Overlay on top of player controls */
      display: block;
      height: 34px;
      width: 110px;
      color: #ccc;
      border: 2px solid #ccc;
      padding: 1px 0;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      line-height: 28px;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    #join-btn:hover {
      color: #fff;
      border-color: #fff;
      background: rgba(0, 0, 0, 0.55);
    }
    .shaka-controls-hide #join-btn, .jw-flag-user-inactive #join-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Floating Toggle Sidebar Button ── */
    #toggle-sidebar-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 2147483647 !important; /* Overlay on top of player controls */
      display: none; /* hidden by default on desktop */
      height: 34px;
      padding: 0 12px;
      color: #ccc;
      border: 2px solid #ccc;
      border-radius: 4px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      line-height: 30px;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #toggle-sidebar-btn:hover {
      color: #fff;
      border-color: #fff;
      background: rgba(0, 0, 0, 0.55);
    }
    .shaka-controls-hide #toggle-sidebar-btn, .jw-flag-user-inactive #toggle-sidebar-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Server Selection Sidebar UI ── */
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
    }
    .sidebar-title span {
      color: var(--primary);
    }
    .server-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .server-item {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }
    .server-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 230, 118, 0.25);
      transform: translateX(-2px);
    }
    .server-item.active {
      background: var(--bg-card-active);
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.1);
    }
    .server-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .server-name {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .server-item.active .server-name {
      color: var(--primary);
    }
    .server-meta {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .badge-vpn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Custom Scrollbar */
    .server-list::-webkit-scrollbar {
      width: 6px;
    }
    .server-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .server-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    .server-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ── Iframe Overlay ── */
    #iframe-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: none;
      background: #000;
    }
    #iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #iframe-container.active {
      display: block;
    }

    /* ── Type Badge ── */
    .badge-type {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-left: 6px;
    }

    /* ── Fullscreen / Embed Mode (sidebar hidden) ── */
    body.fullscreen-mode .sidebar-section {
      display: none;
    }
    body.fullscreen-mode .player-section {
      width: 100vw;
      height: 100vh;
    }

    /* ── Responsive Layout (Medium Screen Side-by-Side Embeds) ── */
    @media (min-width: 481px) and (max-width: 768px) {
      .sidebar-section {
        width: 220px;
      }
    }

    /* ── Responsive Layout (Mobile Stacked Layout) ── */
    @media (max-width: 480px) {
      .player-section {
        width: 100%;
        height: 100%;
        flex: none;
      }
      .sidebar-section {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 200px; /* Narrower drawer */
        height: 100%;
        z-index: 150;
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-left: 1px solid var(--border);
        border-top: none;
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      }
      .sidebar-section.open {
        transform: translateX(0);
      }
      #toggle-sidebar-btn {
        display: block;
      }
      #close-sidebar-btn {
        display: block !important;
      }
      #wm {
        bottom: 55px;
      }
      .shaka-controls-hide #wm {
        bottom: 15px;
      }

      /* Compact mobile scaling overrides */
      .sidebar-header {
        padding: 12px 14px;
      }
      .sidebar-title {
        font-size: 14px;
        letter-spacing: 1px;
      }
      #close-sidebar-btn {
        font-size: 20px;
      }
      .server-list {
        padding: 8px 10px;
        gap: 6px;
      }
      .server-item {
        padding: 8px 10px;
        border-radius: 6px;
      }
      .server-name {
        font-size: 12px;
      }
      .server-meta {
        font-size: 9px;
        letter-spacing: 0.5px;
      }
      .badge-type {
        font-size: 8px;
        padding: 1px 3px;
        margin-left: 3px;
      }
      .badge-vpn {
        font-size: 8px;
        padding: 1px 4px;
      }
    }

    // Build Server List UI (only rendering active/enabled streams)
    function buildServerList() {
      const container = document.getElementById("server-list");
      container.innerHTML = "";
      
      Object.entries(streams).forEach(([id, stream]) => {
        if (stream.enabled === false) return; // Skip offline streams

        const item = document.createElement("div");
        item.className = "server-item";
        item.id = `server-${id}`;
        
        let vpnBadge = "";
        if (stream.vpn) {
          vpnBadge = `<span class="badge-vpn">${stream.vpn} VPN</span>`;
        }

        const typeBadge = stream.type === 'iframe' ? '<span class="badge-type">IFRAME</span>' : '';

        item.innerHTML = `
          <div class="server-details">
            <span class="server-name">${stream.name}${typeBadge}</span>
            <span class="server-meta">${stream.meta}</span>
          </div>
          ${vpnBadge}
        `;
        
        item.onclick = () => {
          selectServer(id);
        };
        
        container.appendChild(item);
      });
    }

    async function destroyEngines() {
      // Restore watermark to #player-container if it is inside the JW Player element
      const wm = document.getElementById('wm');
      const playerContainer = document.getElementById('player-container');
      if (wm && playerContainer && wm.parentNode !== playerContainer) {
        playerContainer.appendChild(wm);
      }

      // Destroy JW Player instance if it exists
      if (window.jwPlayerInstance) {
        try {
          window.jwPlayerInstance.remove();
        } catch(_) {}
        window.jwPlayerInstance = null;
      }

      // Destroy Shaka UI instance
      if (shakaUiInstance) {
        try {
          await shakaUiInstance.destroy();
        } catch(_) {}
        shakaUiInstance = null;
      }
      // Unload / Destroy Shaka player instance
      if (shakaPlayerInstance) {
        try {
          await shakaPlayerInstance.destroy();
        } catch(_) {}
        shakaPlayerInstance = null;
      }
    }

    // Domain check helper (for OKRU proxy-based streams only)
    function isOkruDomainAuthorized() {
      const allowedDomains = [
        'mubthaseem.github.io',
        'zeta-stream.blogspot.com'
      ];
      const host = window.location.hostname.toLowerCase();
      if (allowedDomains.includes(host)) {
        // Also check parent referrer if inside an iframe
        if (window.self !== window.top && document.referrer) {
          try {
            const refHost = new URL(document.referrer).hostname.toLowerCase();
            return allowedDomains.includes(refHost);
          } catch(_) { return false; }
        }
        return true;
      }
      return false;
    }

    // Load selected stream
    async function selectServer(id) {
      let stream = streams[id];
      if (!stream) return;

      // Route Custom Domain HLS stream URL directly to Hugging Face Spaces (with load balancing)
      if (stream.url && (stream.url.includes('mubthaseem-zeta-stream.hf.space') || stream.url.includes('stream.zetasports.blog') || stream.url.includes('stream3.zetasports.blog'))) {
        const useReplica = Math.random() < 0.5;
        const targetSpace = useReplica ? 'mubthaseem-zeta-stream-3' : 'mubthaseem-zeta-stream';
        let directUrl = `https://${targetSpace}.hf.space/live/live.m3u8`;
        directUrl = directUrl + '?t=' + Date.now();
        stream = {
          ...stream,
          url: directUrl
        };
      }

      // Update active styling
      document.querySelectorAll(".server-item").forEach(item => item.classList.remove("active"));
      const activeItem = document.getElementById(`server-${id}`);
      if (activeItem) activeItem.classList.add("active");

      const iframeContainer = document.getElementById('iframe-container');
      
      // Unload active engines
      await destroyEngines();

      // ── OKRU Stream Domain Lock ──────────────────────────────────────────
      // If this stream uses the zetasports-ok-proxy, verify the domain
      const isOkruStream = stream.url.includes('zetasports-ok-proxy.onrender.com') || stream.url.includes('okru-proxy.mubthaseembinalavi.workers.dev');
      if (isOkruStream && !isOkruDomainAuthorized()) {
        // Show restriction image inside JW Player on unauthorized sites
        const wrapper = document.getElementById('media-player-wrapper');
        wrapper.style.display = '';
        wrapper.innerHTML = '<div id="jw-player-el"></div>';
        iframeContainer.classList.remove('active');
        iframeContainer.innerHTML = '';
        jwplayer('jw-player-el').setup({
          image: 'https://lordatomic.github.io/uefa/restriction.png',
          playlist: [],
          width: '100%',
          height: '100%',
          controls: false,
          autostart: false
        });
        console.warn(`[Domain Lock] OKRU stream blocked on unauthorized domain: ${window.location.hostname}`);
        return; // Stop here — do NOT load the real stream
      }
      // ─────────────────────────────────────────────────────────────────────

      const isHls = stream.url.includes('.m3u8') || stream.type === 'hls';

      if (stream.type === 'iframe') {
        // ── IFRAME MODE ──
        const videoEl = document.getElementById('video');
        if (videoEl) videoEl.style.display = 'none';

        const wrapper = document.getElementById('media-player-wrapper');
        if (wrapper) wrapper.style.display = 'none';

        let sandboxAttr = '';
        const sandboxMode = stream.sandbox || 'strict';
        if (sandboxMode === 'strict') {
          sandboxAttr = 'sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"';
        } else if (sandboxMode === 'relaxed') {
          sandboxAttr = 'sandbox="allow-scripts allow-same-origin allow-presentation allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation"';
        } else {
          sandboxAttr = ''; // No sandbox attribute at all (disabled)
        }

        iframeContainer.innerHTML = `<iframe src="${stream.url}" referrerpolicy="no-referrer" allowfullscreen allow="autoplay; fullscreen; encrypted-media" scrolling="no" ${sandboxAttr}></iframe>`;
        iframeContainer.classList.add('active');
        console.log(`Iframe ${id} loaded. Sandbox: ${sandboxMode}`);

      } else if (isHls) {
        // ── HLS / M3U8 MODE (JW Player) ──
        iframeContainer.classList.remove('active');
        iframeContainer.innerHTML = '';

        const wrapper = document.getElementById('media-player-wrapper');
        wrapper.style.display = '';
        wrapper.innerHTML = '<div id="jw-player-el"></div>';

        const jwInstance = jwplayer('jw-player-el').setup({
          playlist: [{
            file: stream.url,
            type: 'hls'
          }],
          autostart: true,
          controls: true,
          width: '100%',
          height: '100%',
          cast: {},
          skin: {
            controlbar: {
              iconsActive: '#00e676',
              timeslider: {
                progress: '#00e676'
              }
            }
          }
        });

        window.jwPlayerInstance = jwInstance;

        let consecutiveRetries = 0;

        jwInstance.on('playing', () => {
          consecutiveRetries = 0;
        });

        function getFallbackVideo() {
          const item = jwInstance.getPlaylistItem();
          const currentFile = item ? item.file : '';
          const base = currentFile.includes('mubthaseem-zeta-stream-3.hf.space')
            ? 'https://mubthaseem-zeta-stream-3.hf.space/live/offline.mp4'
            : 'https://mubthaseem-zeta-stream.hf.space/live/offline.mp4';
          return base + '?t=' + Date.now();
        }

        function loadFallbackVideo() {
          const fallback = getFallbackVideo();
          console.log("Loading fallback video in index.html:", fallback);
          jwInstance.load([{
            file: fallback,
            type: 'mp4'
          }]);
          jwInstance.setConfig({ repeat: true });
          jwInstance.play();
        }

        jwInstance.on('error', (event) => {
          console.warn("JW Player stream error in index.html:", event.message, event.code);
          const item = jwInstance.getPlaylistItem();
          const currentFile = item ? item.file : '';
          const fallback = getFallbackVideo();
          if (currentFile !== fallback) {
            consecutiveRetries++;
            if (consecutiveRetries > 3) {
              console.log("Too many consecutive stream errors. Switching to fallback.");
              loadFallbackVideo();
              return;
            }

            console.log(`Verifying stream health (attempt ${consecutiveRetries})...`);
            fetch(currentFile, { method: 'HEAD' })
              .then(res => {
                if (res.status === 404 || res.status === 403) {
                  console.log("Stream file returned 404/403. Switching to fallback.");
                  loadFallbackVideo();
                } else {
                  console.log("Stream file is still present. Retrying playback in 3s...");
                  setTimeout(() => {
                    const checkItem = jwInstance.getPlaylistItem();
                    const checkFile = checkItem ? checkItem.file : '';
                    if (checkFile !== fallback) {
                      jwInstance.load([{ file: currentFile, type: 'hls' }]);
                      jwInstance.play();
                    }
                  }, 3000);
                }
              })
              .catch(() => {
                console.log("Stream file fetch failed. Switching to fallback.");
                loadFallbackVideo();
              });
          }
        });

        jwInstance.on('setupError', (event) => {
          console.error("JW Player setup error in index.html:", event.message);
          loadFallbackVideo();
        });

        jwInstance.on('complete', () => {
          const item = jwInstance.getPlaylistItem();
          const currentFile = item ? item.file : '';
          if (currentFile.includes('offline.mp4')) {
            jwInstance.play();
          }
        });


        // Sync watermark to JW Player container to stay visible in fullscreen
        jwInstance.on('ready', () => {
          const jwContainer = document.querySelector('.jwplayer');
          const wm = document.getElementById('wm');
          if (jwContainer && wm) {
            jwContainer.appendChild(wm);
          }
        });

        // Autoplay play error catcher
        jwInstance.on('playAttemptFailed', () => {
          console.log("Autoplay failed, user interaction required.");
        });

        console.log(`JW Player loaded HLS stream ${id}`);

      } else {
        // ── DASH / MPD MODE (Shaka Player UI) ──
        iframeContainer.classList.remove('active');
        iframeContainer.innerHTML = '';

        const wrapper = document.getElementById('media-player-wrapper');
        wrapper.style.display = '';
        wrapper.innerHTML = '<video id="video" autoplay playsinline></video>';

        const videoEl = document.getElementById('video');
        videoEl.style.display = '';

        try {
          if (typeof shaka === 'undefined') {
            throw new Error("Shaka Player library not loaded.");
          }
          shakaPlayerInstance = new shaka.Player(videoEl);
          shakaPlayerInstance.configure({
            drm: {
              clearKeys: stream.keys || {}
            }
          });

          // Initialize Shaka UI overlay
          const container = document.getElementById('player-container');
          if (shaka.ui && shaka.ui.Overlay) {
            shakaUiInstance = new shaka.ui.Overlay(shakaPlayerInstance, container, videoEl);
            
            const uiConfig = {
              controlPanelElements: [
                'play_pause',
                'mute',
                'volume',
                'spacer',
                'time_and_duration',
                'quality',
                'fullscreen',
                'overflow_menu'
              ]
            };
            shakaUiInstance.configure(uiConfig);
          }

          await shakaPlayerInstance.load(stream.url);
          console.log(`Shaka Player UI loaded stream ${id} successfully.`);
        } catch (error) {
          console.error(`Shaka Player UI error loading stream ${id}:`, error);
        }
      }

      // Auto-close overlay sidebar on mobile when server is loaded
      if (window.innerWidth <= 480) {
        const sidebar = document.getElementById('sidebar-section');
        if (sidebar) sidebar.classList.remove('open');
      }
    }

    // Initialize Player and setup initial state
    async function initApp() {
      console.log("initApp triggered.");
      
      // Install Shaka polyfills (required for DASH on some platforms)
      if (typeof shaka !== 'undefined' && shaka.polyfill) {
        shaka.polyfill.installAll();
      }

      // Build List
      buildServerList();

      // Parse query parameters
      const urlParams = new URLSearchParams(window.location.search);
      
      let targetId = null;
      let hideSidebar = false;

      // 1. Check if we should hide the sidebar (embed mode)
      // Hide if ?embed=true or ?sidebar=false is present
      if (urlParams.get('embed') === 'true' || urlParams.get('sidebar') === 'false') {
        hideSidebar = true;
      }

      // 2. Check for stream target
      // Support ?stream=ID or ?s=ID
      let streamParam = urlParams.get('stream') || urlParams.get('s');
      
      if (streamParam) {
        const directId = Object.keys(streams).find(
          id => id.toLowerCase() === streamParam.toLowerCase()
        );
        if (directId) {
          targetId = directId;
        }
      } else {
        // Backwards compatibility for ?M6, ?server1, etc.
        // Get the first parameter key as the raw string
        const keys = Array.from(urlParams.keys());
        if (keys.length > 0) {
          const rawKey = keys[0].trim();
          const numMatch = rawKey.match(/^server(\d+)$/i);
          if (numMatch) {
            const n = parseInt(numMatch[1], 10);
            const enabledIds = Object.keys(streams).filter(id => streams[id].enabled !== false);
            targetId = enabledIds[n - 1] || enabledIds[0];
            // Old format ?serverN defaults to hiding the sidebar unless sidebar=true is explicitly set
            if (urlParams.get('sidebar') !== 'true') {
              hideSidebar = true;
            }
          } else {
            const directId = Object.keys(streams).find(
              id => id.toLowerCase() === rawKey.toLowerCase()
            );
            if (directId) {
              targetId = directId;
              // Old format ?STREAM_ID defaults to hiding the sidebar unless sidebar=true is explicitly set
              if (urlParams.get('sidebar') !== 'true') {
                hideSidebar = true;
              }
            }
          }
        }
      }

      if (hideSidebar) {
        document.body.classList.add('fullscreen-mode');
      }

      if (targetId) {
        await selectServer(targetId);
        if (hideSidebar) {
          // Request browser fullscreen automatically on user click or layout ready
          const elem = document.getElementById('player-container');
          if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
          } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
          }
        }
      } else {
        const firstEnabled = Object.keys(streams).find(id => streams[id].enabled !== false);
        if (firstEnabled) selectServer(firstEnabled);
      }
    }

    // Toggle mobile overlay sidebar
    function toggleMobileSidebar() {
      const sidebar = document.getElementById('sidebar-section');
      if (sidebar) sidebar.classList.toggle('open');
    }

    // Run initialization as soon as page resources are ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
