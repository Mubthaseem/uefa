<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
  <title>ZETA SPORTS – Premium Live Player</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.js"></script>
  <script src="https://ssl.p.jwpcdn.com/player/v/8.21.2/jwplayer.js"></script>
  <script>jwplayer.key="64HPbvSQorQcd52B8XFuhMtEoitbvY/EXJmMBfKcXZQU2Rnn";</script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00e676;
      --primary-glow: rgba(0, 230, 118, 0.4);
      --bg-dark: #05070a;
      --bg-sidebar: #0a0f1a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(0, 230, 118, 0.06);
      --bg-card-active: rgba(0, 230, 118, 0.12);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    /* ── App Layout (Split Screen) ── */
    .app-layout {
      display: flex;
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .player-section {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: #000;
    }

    .sidebar-section {
      width: 300px;
      height: 100%;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── Video Player Container ── */
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Override Shaka UI styling to match green theme */
    .shaka-range-element {
      color: var(--primary) !important;
    }
    .shaka-volume-bar {
      color: var(--primary) !important;
    }
    .shaka-spinner-path {
      stroke: var(--primary) !important;
    }
    .shaka-play-button {
      background: var(--primary) !important;
    }

    /* JW Player styling overrides to match green theme */
    .jwplayer {
      --jw-color-active: var(--primary) !important;
      --jw-color-inactive: var(--text-muted) !important;
      --jw-controlbar-icons-active: var(--primary) !important;
    }
    .jw-logo, .jw-watermark {
      display: none !important;
    }

    /* ── Floating Watermark ── */
    #wm {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647 !important; /* Always on top of all players and control bars */
      pointer-events: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.6;
      transition: opacity 0.4s ease, bottom 0.4s ease;
    }
    .shaka-controls-hide #wm, .jw-flag-user-inactive #wm {
      opacity: 0.5 !important;
      bottom: 25px;
    }
    #player-container:fullscreen #wm,
    #player-container:-webkit-full-screen #wm,
    .jw-flag-fullscreen #wm {
      opacity: 0.5 !important;
    }
    .wm-rule {
      width: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary));
    }
    .wm-rule.r {
      background: linear-gradient(90deg, var(--primary), transparent);
    }
    .wm-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .wm-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 2px 10px #000, 0 0 20px rgba(0, 230, 118, 0.3);
    }
    .wm-name span {
      color: var(--primary);
    }
    .wm-url {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 0 1px 5px #000;
    }

    /* ── Floating Join Button ── */
    #join-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 2147483647 !important; /* Overlay on top of player controls */
      display: block;
      height: 34px;
      width: 110px;
      color: #ccc;
      border: 2px solid #ccc;
      padding: 1px 0;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      line-height: 28px;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    #join-btn:hover {
      color: #fff;
      border-color: #fff;
      background: rgba(0, 0, 0, 0.55);
    }
    .shaka-controls-hide #join-btn, .jw-flag-user-inactive #join-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Floating Toggle Sidebar Button ── */
    #toggle-sidebar-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 2147483647 !important; /* Overlay on top of player controls */
      display: none; /* hidden by default on desktop */
      height: 34px;
      padding: 0 12px;
      color: #ccc;
      border: 2px solid #ccc;
      border-radius: 4px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      line-height: 30px;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #toggle-sidebar-btn:hover {
      color: #fff;
      border-color: #fff;
      background: rgba(0, 0, 0, 0.55);
    }
    .shaka-controls-hide #toggle-sidebar-btn, .jw-flag-user-inactive #toggle-sidebar-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Server Selection Sidebar UI ── */
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
    }
    .sidebar-title span {
      color: var(--primary);
    }
    .server-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .server-item {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }
    .server-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 230, 118, 0.25);
      transform: translateX(-2px);
    }
    .server-item.active {
      background: var(--bg-card-active);
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.1);
    }
    .server-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .server-name {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .server-item.active .server-name {
      color: var(--primary);
    }
    .server-meta {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .badge-vpn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Custom Scrollbar */
    .server-list::-webkit-scrollbar {
      width: 6px;
    }
    .server-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .server-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    .server-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ── Iframe Overlay ── */
    #iframe-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: none;
      background: #000;
    }
    #iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #iframe-container.active {
      display: block;
    }

    /* ── Type Badge ── */
    .badge-type {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-left: 6px;
    }

    /* ── Fullscreen / Embed Mode (sidebar hidden) ── */
    body.fullscreen-mode .sidebar-section {
      display: none;
    }
    body.fullscreen-mode .player-section {
      width: 100vw;
      height: 100vh;
    }

    /* ── Responsive Layout (Medium Screen Side-by-Side Embeds) ── */
    @media (min-width: 481px) and (max-width: 768px) {
      .sidebar-section {
        width: 220px;
      }
    }

    /* ── Responsive Layout (Mobile Stacked Layout) ── */
    @media (max-width: 480px) {
      .player-section {
        width: 100%;
        height: 100%;
        flex: none;
      }
      .sidebar-section {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 200px; /* Narrower drawer */
        height: 100%;
        z-index: 150;
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-left: 1px solid var(--border);
        border-top: none;
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      }
      .sidebar-section.open {
        transform: translateX(0);
      }
      #toggle-sidebar-btn {
        display: block;
      }
      #close-sidebar-btn {
        display: block !important;
      }
      #wm {
        bottom: 55px;
      }
      .shaka-controls-hide #wm {
        bottom: 15px;
      }

      /* Compact mobile scaling overrides */
      .sidebar-header {
        padding: 12px 14px;
      }
      .sidebar-title {
        font-size: 14px;
        letter-spacing: 1px;
      }
      #close-sidebar-btn {
        font-size: 20px;
      }
      .server-list {
        padding: 8px 10px;
        gap: 6px;
      }
      .server-item {
        padding: 8px 10px;
        border-radius: 6px;
      }
      .server-name {
        font-size: 12px;
      }
      .server-meta {
        font-size: 9px;
        letter-spacing: 0.5px;
      }
      .badge-type {
        font-size: 8px;
        padding: 1px 3px;
        margin-left: 3px;
      }
      .badge-vpn {
        font-size: 8px;
        padding: 1px 4px;
      }
    }
  </style>
</head>
