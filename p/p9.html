<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream P9 - Arabic 4K / streamhosting</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #container{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  video,#container>.plyr{width:100%;height:100%}
  #loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-family:sans-serif;font-size:18px;text-align:center;z-index:10}
  #loading .spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #watermark{position:absolute;bottom:65px;right:18px;color:rgba(255,255,255,0.55);font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;letter-spacing:1px;pointer-events:none;z-index:9999;text-shadow:0 1px 6px rgba(0,0,0,0.9),0 0 12px rgba(0,0,0,0.7);user-select:none;display:flex;align-items:center;gap:6px}
  #watermark::before{content:'⚽';font-size:13px}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>Loading stream...</div>
<div id="container" style="display:none">
  <video id="video" playsinline controls></video>
  <div id="watermark">ZetaSports.blog</div>
</div>
<script>
const STREAM_URL = 'https://mubthaseem-zeta-stream.hf.space/proxy?url=https%3A%2F%2F1nyaler.streamhostingcdn.top%2Fstream%2F23%2Findex.m3u8&type=m3u8';
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const container = document.getElementById('container');
const watermark = document.getElementById('watermark');

function handleFullscreenChange() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
  if (fsEl) { fsEl.appendChild(watermark); watermark.style.position='fixed'; }
  else { container.appendChild(watermark); watermark.style.position='absolute'; }
}
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);

function startPlayer(src) {
  if (Hls.isSupported()) {
    const hls = new Hls({ enableWorker: true, maxBufferLength: 30 });
    hls.loadSource(src); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      loading.style.display='none'; container.style.display='flex';
      new Plyr(video, { controls:['play','progress','current-time','mute','volume','fullscreen'], autoplay:true });
      video.play().catch(()=>{});
    });
    hls.on(Hls.Events.ERROR, (e,data) => { if(data.fatal) loading.innerHTML='<div>⚠️ Stream Error.</div>'; });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src=src; video.addEventListener('loadedmetadata',()=>{ loading.style.display='none'; container.style.display='flex'; video.play(); });
  }
}
startPlayer(STREAM_URL);
</script>
</body>
</html>
