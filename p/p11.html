<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZetaSports Multi-Player</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Clappr Player (HLS) -->
<script src="https://cdn.jsdelivr.net/npm/@clappr/player@0.11.16/dist/clappr.min.js"></script>

<!-- Shaka Player UI & Video Engine (DASH / ClearKey) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css" crossorigin="anonymous">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #020617;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* Clappr and Video element styling */
  #player-clappr, #shaka-video-container {
    width: 100%;
    height: 100%;
  }
  video {
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* Shaka UI styling override to match premium design */
  .shaka-video-container {
    width: 100% !important;
    height: 100% !important;
  }
  
  /* Loading screen */
  #loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #f8fafc;
    text-align: center;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: #00e676;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .loading-text {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Watermark Overlay */
  #watermark {
    position: absolute;
    bottom: 60px;
    right: 20px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.5px;
    pointer-events: none;
    z-index: 99999;
    text-shadow: 0 2px 8px rgba(0,0,0,0.95), 0 0 15px rgba(0,0,0,0.7);
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }
  #watermark::before {
    content: '⚽';
    font-size: 14px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  /* Error state */
  .error-message {
    font-size: 1.2rem;
    color: #ef4444;
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading ZetaSports Stream...</div>
</div>

<div id="container">
  <!-- Clappr player mount point -->
  <div id="player-clappr" style="display: none;"></div>

  <!-- Shaka player mount point -->
  <div id="shaka-video-container" style="display: none;" data-shaka-player-container>
    <video id="shaka-video" playsinline autoplay data-shaka-player></video>
  </div>

  <div id="watermark">ZetaSports</div>
</div>

<script>
  const DIRECT_HLS_CHANNELS = {

    },
    fox_sports_hls: {

      url: 'https://d1jzu95oc8fgt3.cloudfront.net/FOX_Sports.m3u8'
    },
    telemundo_us_hls: {
      name: 'World Cup Telemundo US',
      url: 'https://nbculocallive.akamaized.net/hls/live/2037499/puertorico/stream1/master.m3u8'
    }
  };

  const DASH_CHANNELS = {
    cignal_english: {
      name: 'CIGNAL ENGLISH',
      mpd: 'https://qp-pldt-live-bpk-ucd-prod.akamaized.net/bpk-tv/ch299/default/index.mpd',
      clearkey: { '549ab7cd35a64bb6bb479ecead04d69d': '829799ed534d11fcadeb4b192467e050' }
    },
    fifa_bpk_tv: {
      name: 'World Cup BPK TV FIFA',
      mpd: 'https://qp-pldt-live-bpk-ucd-prod.akamaized.net/bpk-tv/fifa_ppv1/default/index.mpd',
      clearkey: {
        '2c338a117d434ce4bbe3569231af90f1': 'a9633d901ee8a3f4f58ac314b5c5f4fb',
        '17bb9e12c9d844bb9d032a5399d61cc5': 'a9633d901ee8a3f4f58ac314b5c5f4fb'
      }
    },
    match_futbol: {
      name: 'World Cup MATCH! Futbol',
      mpd: 'https://video.beeline.tv/live/d/channel319.isml/manifest-stb.mpd',
      clearkey: { '9145a6e0f778e61866f573d4944dd533': 'd02173d40515fea5c83944f21d0f3114' }
    },
    caze_tv: {
      name: 'World Cup CazeTV',
      mpd: 'https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/3ynrpdanq2/out/v1/81fd4c26584044d2b1a1cc5b32fa9af0/cenc.mpd',
      clearkey: { '34475edab991ad5e92548aebd710410a': '501b209cccd323ac00bf5ac15b406cb4' }
    },
    telemundo: {
      name: 'World Cup Telemundo',
      mpd: 'https://proxy.sevaexchange.com/https://live-oneapp-prd-news.akamaized.net/Content/CMAF_OL2-CTR-4s-v2/Live/channel(kvea)/master.mpd',
      clearkey: { 'ce7ab3022e753307997f58afe001bac4': '72d631a66e635c60829a0fe7705516c1' }
    },
    d_sports: {
      name: 'World Cup D Sports',
      mpd: 'https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/x0srg3jjpz/out/v1/f779c49314394d61886d63f58d9d52e4/cenc.mpd',
      clearkey: { '4f4c3a9912ea752e88f4497864a1bc8b': '278128004fe8c6ffb2cd2a0c154a241a' }
    },
    d_sports_plus: {
      name: 'World Cup D Sports+',
      mpd: 'https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/kp7qfx2tly/out/v1/bbfb730b45b74d4ea875d75786ea3f13/cenc-sd.mpd',
      clearkey: { '8afa490e1640be969729fb459182e4ec': '6f129820cdd5b6978a98c604c72cf05b' }
    },
    fox_one_4k: {
      name: 'FOX ONE HD',
      mpd: 'https://otte.cache.aiv-cdn.net/bom-nitro/live/dash/enc/ap5wz1ofsp/out/v1/7fa6feef143747beaa186ebb6dfb2532/cenc.mpd',
      clearkey: { 'c620c93c60c04999eb9ddc28ecfb70a8': 'e76a709c251313190e76cb3c3d3a5824' }
    },
    fox_1_ar: {
      name: 'World Cup Fox 1 AR',
      mpd: 'https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/enc/ajfoeddkbz/out/v1/b78800b9b2304879b15843f455836829/cenc.mpd',
      clearkey: { 'f6564ec2aee819046328a0e153be574d': 'ff46a8a1031eb27ef22576a077c98ab7' }
    },
    tsn_1: {
      name: 'World Cup TSN 1',
      mpd: 'https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/w0rehjjrwe/out/v1/69a2a7041395406b970598f61680e7cf/cenc.mpd',
      clearkey: { '14eeabf30c14b7fbf3008c03099ce011': '17d2ac8dbc5429bd70af3433aa12158d' }
    },
    tsn_sports: {
      name: 'TSN SPORTS FHD',
      mpd: 'https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/w0rehjjrwe/out/v1/69a2a7041395406b970598f61680e7cf/cenc.mpd',
      clearkey: { '14eeabf30c14b7fbf3008c03099ce011': '17d2ac8dbc5429bd70af3433aa12158d' }
    },
    tv_1: {
      name: 'World Cup TV 1',
      mpd: 'https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/c7di7zkdor/out/v1/f7d5b356e048494a8325563e8916d50b/cenc.mpd',
      clearkey: { '745cd6ec34a58f2f7ac2af35dc3da6d2': 'ae008f1e47e6567fe4201a6ff8f1ae54' }
    },
    ct_sport: {
      name: 'World Cup CT Sport',
      mpd: 'https://dash2.antik.sk/stream/nvidia_ct_sport/playlist_cenc.mpd',
      clearkey: { '11223344556677889900112233445566': '4b80724d0ef86bcb2c21f7999d67739d' }
    }
  };

  const urlParams = new URLSearchParams(window.location.search);
  const ch = urlParams.get('ch');
  let streamUrl = urlParams.get('url');
  let type = urlParams.get('type');
  const keyString = urlParams.get('key'); // Format: kid1:key1,kid2:key2
  let keysObj = null;

  // Perform lookup based on channel code "ch"
  if (ch) {
    if (DIRECT_HLS_CHANNELS[ch]) {
      streamUrl = DIRECT_HLS_CHANNELS[ch].url;
      type = 'm3u8';
    } else if (DASH_CHANNELS[ch]) {
      streamUrl = DASH_CHANNELS[ch].mpd;
      type = 'mpd';
      keysObj = DASH_CHANNELS[ch].clearkey;
    }
  }

  const loading = document.getElementById('loading');
  const watermark = document.getElementById('watermark');
  const clapprContainer = document.getElementById('player-clappr');
  const shakaContainer = document.getElementById('shaka-video-container');

  // Update title loading text with the channel name
  const channelName = (ch && (DIRECT_HLS_CHANNELS[ch]?.name || DASH_CHANNELS[ch]?.name)) || "ZetaSports Stream";
  document.querySelector('.loading-text').textContent = `Loading ${channelName}...`;

  // Detect type if not provided explicitly
  if (!type && streamUrl) {
    if (streamUrl.includes('.mpd')) {
      type = 'mpd';
    } else {
      type = 'm3u8';
    }
  }

  // Robust Fullscreen Watermark Handling
  function handleFullscreenChange() {
    const fsElement = document.fullscreenElement || 
                      document.webkitFullscreenElement || 
                      document.mozFullScreenElement || 
                      document.msFullscreenElement;
    if (fsElement) {
      fsElement.appendChild(watermark);
      watermark.style.position = 'fixed';
    } else {
      document.getElementById('container').appendChild(watermark);
      watermark.style.position = 'absolute';
    }
  }
  document.addEventListener('fullscreenchange', handleFullscreenChange);
  document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
  document.addEventListener('mozfullscreenchange', handleFullscreenChange);
  document.addEventListener('MSFullscreenChange', handleFullscreenChange);

  function showError(msg) {
    loading.innerHTML = `<div class="error-message">⚠️ ${msg}</div>`;
  }

  function startClappr(url) {
    clapprContainer.style.display = 'block';
    
    const player = new Clappr.Player({
      source: url,
      parentId: "#player-clappr",
      width: '100%',
      height: '100%',
      autoPlay: true,
      events: {
        onReady: function() {
          loading.style.display = 'none';
        },
        onError: function(err) {
          console.error("Clappr Error:", err);
          showError("Failed to load stream. Please try again.");
        }
      }
    });
  }

  function startShaka(url, keys, preParsedKeys) {
    shakaContainer.style.display = 'block';
    const video = document.getElementById('shaka-video');
    const container = document.getElementById('shaka-video-container');

    // Parse ClearKeys if provided
    let clearKeysMap = preParsedKeys || {};
    if (keys && !preParsedKeys) {
      const keyPairs = keys.split(',');
      keyPairs.forEach(pair => {
        const parts = pair.split(':');
        if (parts.length === 2) {
          clearKeysMap[parts[0].trim()] = parts[1].trim();
        }
      });
    }

    const player = new shaka.Player();
    const ui = new shaka.ui.Overlay(player, container, video);

    player.addEventListener('error', (event) => {
      console.error('Shaka Player Error:', event.detail);
      showError("Stream error or geo-restriction active.");
    });

    player.attach(video).then(() => {
      // Configure DRM if ClearKeys are specified
      if (Object.keys(clearKeysMap).length > 0) {
        player.configure({
          drm: {
            clearKeys: clearKeysMap
          }
        });
      }
      return player.load(url);
    }).then(() => {
      loading.style.display = 'none';
      video.play().catch(err => {
        console.log("Autoplay blocked, offering play option:", err);
      });
    }).catch(err => {
      console.error("Shaka load error:", err);
      showError("Failed to initialize or decrypt stream.");
    });
  }

  // Initialize player based on parameters
  if (!streamUrl) {
    showError("No stream URL specified. Use ?ch=CHANNEL_CODE or ?url=YOUR_URL");
  } else {
    try {
      if (type === 'mpd') {
        startShaka(streamUrl, keyString, keysObj);
      } else {
        startClappr(streamUrl);
      }
    } catch (e) {
      console.error(e);
      showError("An unexpected player error occurred.");
    }
  }
</script>
</body>
</html>
