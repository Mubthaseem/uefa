<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZetaSports - Live Stream</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Plyr Player (HLS) -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #020617;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* Plyr container and video element styling */
  #plyr-video-container {
    width: 100%;
    height: 100%;
  }
  video, #plyr-video-container .plyr {
    width: 100% !important;
    height: 100% !important;
    background: #000;
  }
  
  /* Loading screen */
  #loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #f8fafc;
    text-align: center;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: #00e676;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .loading-text {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Watermark Overlay */
  #watermark {
    position: absolute;
    bottom: 60px;
    right: 20px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.5px;
    pointer-events: none;
    z-index: 99999;
    text-shadow: 0 2px 8px rgba(0,0,0,0.95), 0 0 15px rgba(0,0,0,0.7);
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }
  #watermark::before {
    content: '⚽';
    font-size: 14px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  /* Error state */
  .error-message {
    font-size: 1.2rem;
    color: #ef4444;
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading ZetaSports Stream...</div>
</div>

<div id="container">
  <!-- Plyr player mount point -->
  <div id="plyr-video-container" style="display: none;">
    <video id="plyr-video" playsinline controls></video>
  </div>

  <div id="watermark">ZetaSports</div>
</div>

<script>
  const streamUrl = "https://pub-1a94420c90dc417cb2af6b4a4adc4704.r2.dev/live/live.m3u8";

  const loading = document.getElementById('loading');
  const watermark = document.getElementById('watermark');
  const plyrContainer = document.getElementById('plyr-video-container');

  // Robust Fullscreen Watermark Handling
  function handleFullscreenChange() {
    const fsElement = document.fullscreenElement || 
                      document.webkitFullscreenElement || 
                      document.mozFullScreenElement || 
                      document.msFullscreenElement;
    if (fsElement) {
      fsElement.appendChild(watermark);
      watermark.style.position = 'fixed';
    } else {
      document.getElementById('container').appendChild(watermark);
      watermark.style.position = 'absolute';
    }
  }
  document.addEventListener('fullscreenchange', handleFullscreenChange);
  document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
  document.addEventListener('mozfullscreenchange', handleFullscreenChange);
  document.addEventListener('MSFullscreenChange', handleFullscreenChange);

  function showError(msg) {
    loading.innerHTML = `<div class="error-message">⚠️ ${msg}</div>`;
  }

  function startPlyr(url) {
    plyrContainer.style.display = 'block';
    const video = document.getElementById('plyr-video');
    
    if (Hls.isSupported()) {
      const hls = new Hls({ enableWorker: false, maxBufferLength: 30 });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        loading.style.display = 'none';
        
        const availableQualities = hls.levels.map((l) => l.height);
        availableQualities.unshift(0); // Auto
        
        new Plyr(video, { 
          controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
          settings: ['quality', 'speed'],
          quality: {
            default: 0,
            options: availableQualities,
            forced: true,
            onChange: (newQuality) => {
              if (newQuality === 0) {
                hls.currentLevel = -1;
              } else {
                hls.levels.forEach((level, idx) => {
                  if (level.height === newQuality) hls.currentLevel = idx;
                });
              }
            }
          },
          autoplay: true 
        });
        video.play().catch(()=>{});
      });
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          console.error("HLS fatal error:", data);
          showError("Failed to load stream. Please try again.");
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      loading.style.display = 'none';
      
      new Plyr(video, {
        controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
        autoplay: true
      });
      video.play().catch(()=>{});
    }
  }

  // Initialize player
  try {
    startPlyr(streamUrl);
  } catch (e) {
    console.error(e);
    showError("An unexpected player error occurred.");
  }
</script>
</body>
</html>
